services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: onothiti-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SERVER_PASSWORD:-Onothiti_Dev_123}
      MSSQL_PID: Developer
    ports:
      - "1433:1433"
    volumes:
      - onothiti-sql:/var/opt/mssql
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1" -C
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 25s

volumes:
  onothiti-sql:
