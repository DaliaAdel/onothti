function toast(message){const el=document.getElementById('toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.classList.remove('show'),2600)}
function interactions(){
 document.querySelectorAll('[data-toast]').forEach(b=>b.addEventListener('click',e=>{if(b.tagName==='BUTTON')e.preventDefault();toast(b.dataset.toast)}));
 const login=document.getElementById('loginForm');if(login)login.addEventListener('submit',e=>{e.preventDefault();const p=document.getElementById('phone');if(p.value.replace(/\D/g,'').length<9){toast('أدخلي رقم هاتف صحيحًا من 9 أرقام');p.focus()}else{sessionStorage.setItem('loginRole',p.value.replace(/\D/g,'').endsWith('2')?'provider':'researcher');location.href=paths.otp}});
 const signup=document.getElementById('signupForm');if(signup)signup.addEventListener('submit',e=>{e.preventDefault();const p=document.getElementById('signupPhone'),password=document.getElementById('signupPassword'),confirm=document.getElementById('signupPasswordConfirm'),terms=document.getElementById('terms');if(p.value.replace(/\D/g,'').length<9){toast('أدخلي رقم جوال صحيحًا من 9 أرقام');p.focus()}else if(password.value!==confirm.value){toast('كلمة المرور وتأكيدها غير متطابقين');confirm.focus()}else if(!terms.checked)toast('وافقي على الشروط للمتابعة');else location.href=paths.signupOtp});
 const otp=document.querySelectorAll('.otp input');otp.forEach((el,i)=>el.addEventListener('input',()=>{el.value=el.value.replace(/\D/g,'').slice(0,1);if(el.value&&otp[i+1])otp[i+1].focus()}));const otpForm=document.getElementById('otpForm');if(otpForm)otpForm.addEventListener('submit',e=>{e.preventDefault();if([...otp].some(x=>!x.value))toast('أكملي رمز التحقق أولًا');else location.href=sessionStorage.getItem('loginRole')==='provider'?paths.pd:paths.rd});const signupOtpForm=document.getElementById('signupOtpForm');if(signupOtpForm)signupOtpForm.addEventListener('submit',e=>{e.preventDefault();if([...otp].some(x=>!x.value))toast('أكملي رمز التحقق أولًا');else location.href=paths.accountType});
 const researcherSignup=document.getElementById('researcherSignupForm');if(researcherSignup)researcherSignup.addEventListener('submit',e=>{e.preventDefault();toast('تم إنشاء حساب الباحثة بنجاح');setTimeout(()=>location.href=paths.rd,700)});
 const providerSignup=document.getElementById('providerSignupForm');if(providerSignup)providerSignup.addEventListener('submit',e=>{e.preventDefault();toast('تم إنشاء حساب صانعة الجمال بنجاح');setTimeout(()=>location.href=paths.pd,700)});
 document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{const parent=c.parentElement;parent.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));c.classList.add('active')}));
 const search=document.getElementById('serviceSearch');if(search)search.addEventListener('input',()=>{let shown=0;document.querySelectorAll('#serviceGrid .service-card').forEach(c=>{const ok=c.dataset.service.includes(search.value.trim());c.style.display=ok?'':'none';if(ok)shown++});document.getElementById('empty').style.display=shown?'none':'block'});
 document.querySelectorAll('#tabs button,#paymentTabs button').forEach(b=>b.addEventListener('click',()=>{b.parentElement.querySelectorAll('button').forEach(x=>x.classList.remove('active'));b.classList.add('active');toast('تم تغيير القسم إلى: '+b.textContent)}));
 const profile=document.getElementById('profileForm');if(profile)profile.addEventListener('submit',e=>{e.preventDefault();toast('تم حفظ التغييرات وإرسالها للمراجعة')});
 const upload=document.getElementById('uploadZone');if(upload){['dragenter','dragover'].forEach(n=>upload.addEventListener(n,e=>{e.preventDefault();upload.classList.add('drag')}));['dragleave','drop'].forEach(n=>upload.addEventListener(n,e=>{e.preventDefault();upload.classList.remove('drag');if(n==='drop')toast('تمت إضافة ملف الإثبات بنجاح')}));upload.querySelector('input').addEventListener('change',()=>toast('تمت إضافة ملف الإثبات بنجاح'))}
 let time=102,timer=document.getElementById('timer');if(timer)setInterval(()=>{if(time>0)time--;timer.textContent=String(Math.floor(time/60)).padStart(2,'0')+':'+String(time%60).padStart(2,'0')},1000)
}
const key=document.body.dataset.screen;document.body.innerHTML=screens[key]||'<main style="padding:40px">الشاشة غير موجودة</main>';interactions();
</script></body></html>
